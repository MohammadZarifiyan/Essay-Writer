[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
priority=1
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/apache.out.log
stderr_logfile=/var/log/supervisor/apache.err.log

[program:supercronic]
command=/usr/local/bin/supercronic /var/www/docker/production/app/crontab
priority=2
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/supercronic.out.log
stderr_logfile=/var/log/supervisor/supercronic.err.log

[program:horizon]
command=php /var/www/artisan horizon
priority=3
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/horizon.out.log
stderr_logfile=/var/log/supervisor/horizon.err.log
stopwaitsecs=3600
