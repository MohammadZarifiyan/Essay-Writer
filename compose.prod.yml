name: essay_writer_production
services:
  app:
    build:
      context: .
      dockerfile: docker/production/app/Dockerfile
    restart: unless-stopped
    volumes:
      - storage:/var/www/storage
      - supervisor-logs:/var/log/supervisor
    env_file: .env
    networks:
      - app
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:9.0
    restart: unless-stopped
    user: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_DATABASE:-app}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - app
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "--silent" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6
    restart: unless-stopped
    command: ["--appendonly yes"]
    volumes:
      - redis-data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  app:

volumes:
  mysql:
  redis-data:
  storage:
  supervisor-logs:
